<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="htmx-config"
          content='{"morphIgnore":["data-htmx-powered","aria-grabbed","data-pending-delete"],"morphSkip":"[data-is-predicting]"}'>
    <title>Hyperspace</title>

    <link rel="icon" href="{{ url_for('static', path='favicon.svg') }}" type="image/svg+xml">
    <link href="{{ url_for('static', path='css/output.css') }}?v=mobile4" rel="stylesheet">

    <script src="{{ url_for('static', path='js/fzstd.min.js') }}"></script>
    <script src="{{ url_for('static', path='js/htmx.js') }}"></script>
    <script src="{{ url_for('static', path='js/hx-live.js') }}"></script>
    <script src="{{ url_for('static', path='js/hx-optimistic.js') }}"></script>
    <script src="{{ url_for('static', path='js/hx-sse.js') }}"></script>
    <script>
        htmx.registerExtension("hx-sse-zstd", {
            htmx_before_sse_message: (element, detail) => {
                let bytes = Uint8Array.from(atob(detail.message.data), c => c.charCodeAt(0));
                detail.message.data = new TextDecoder().decode(fzstd.decompress(bytes));
            },
        })
    </script>
</head>

<body class="group/body bg-background text-foreground font-mono h-screen overflow-hidden touch-none"
      data-token="{{ player.token if player else '' }}"
      data-drag-brick=""
      data-is-dragging=""
      data-is-deleting=""
      hx-boost:inherited="true"
      hx-swap:inherited="innerMorph"
        {% if player %}
      hx-sse:connect="/sse"
        {% endif %}
      hx-on="
        keydown[key=='Shift'] -> data.isDeleting = true;
        keyup[key=='Shift']   -> data.isDeleting = false;
        pointerover target:button[data-x] passive -> {
          var cx = +event.target.dataset.x, cy = +event.target.dataset.y;
          ajax('PATCH', '/cursors', {values: {x: cx, y: cy, z: 0}, swap: 'none'});
          var c = q('#cursor-' + data.token);
          if (!c.count) return;
          var half = {{ grid_size * 32 }};
          var px = cx * 64 + 32 - half, py = cy * 64 + 32 - half;
          var diff = py - px, sum = px + py, denom = 1000000 - 612 * diff;
          c.style.setProperty('--sx', Math.round(707000 * sum / denom) + 'px');
          c.style.setProperty('--sy', Math.round(354000 * diff / denom) + 'px');
        };
        pointerdown -> {
          var brick = event.target.closest('.brick');
          if (!brick) return;
          event.preventDefault();
          var id = parseInt(brick.dataset.brickId);
          if (event.shiftKey) { brick.setAttribute('data-pending-delete', ''); ajax('DELETE', '/bricks/' + id, {swap: 'none'}); return; }
          data.dragBrick = id;
          data.isDragging = false;
        };
        pointermove -> {
          if (!data.dragBrick) return;
          var brick = q('#brick-' + data.dragBrick);
          if (!brick.count) return;
          var under = document.elementFromPoint(event.clientX, event.clientY);
          var cell  = under && under.closest('[data-x]');
          if (!cell) return;
          var cx = +cell.dataset.x, cy = +cell.dataset.y;
          if (cx === +brick.dataset.x && cy === +brick.dataset.y) return;
          if (!data.isDragging) {
            data.isDragging = true;
            ajax('POST', '/bricks/' + data.dragBrick + '/drag/start', {swap: 'none'});
          }
          brick.dataset.x = cx; brick.dataset.y = cy;
          ajax('PATCH', '/bricks/' + data.dragBrick + '/drag/continue', {values: {x: cx, y: cy}, swap: 'none'});
        };
        pointerup -> {
          if (!data.dragBrick) return;
          if (data.isDragging) ajax('POST', '/bricks/' + data.dragBrick + '/drag/end', {swap: 'none'});
          data.dragBrick = '';
          data.isDragging = '';
        }">

<div id="app" class="relative w-full h-full">
    {% include "_brick_list.html" %}
    {% include "_player_list.html" %}
    {% include "_event_list.html" %}
    {% include "_cursor_list.html" %}

    <button id="logout-btn"
            hx-post="/logout"
            title="Log out"
            class="absolute bottom-12 sm:bottom-4 left-4 z-50 p-2 rounded-lg bg-card border border-border text-muted-foreground hover:text-foreground cursor-pointer font-sans">
        <span class="icon-[lucide--log-out] size-4 block"></span>
    </button>
</div>

{% if not player %}
    {% include "_player_form.html" %}
{% endif %}

</body>
</html>
