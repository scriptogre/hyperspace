<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hyperspace</title>

    <link rel="icon" href="{{ url_for('static', path='favicon.svg') }}" type="image/svg+xml">

    <link href="{{ url_for('static', path='css/output.css') }}" rel="stylesheet">

    <!-- <qr-code> Web Component (https://github.com/bitjson/qr-code) -->
    <script defer src="{{ url_for('static', path='js/qr-code.js') }}"></script>

    <script src="{{ url_for('static', path='js/htmx.js') }}"></script>
    <script src="{{ url_for('static', path='js/hx-multipart.js') }}"></script>
    <script src="{{ url_for('static', path='js/hx-live.js') }}"></script>
    <script src="{{ url_for('static', path='js/hx-latency.js') }}"></script>
    <script src="{{ url_for('static', path='js/drag-and-drop-mobile-polyfill.js') }}"></script>

    <script>
        htmx.registerExtension('dollar-query', {
            htmx_scope: (element, detail) => detail.scope.$ = detail.scope.q
        })
    </script>
</head>

<body data-delete-mode="false"
      hx-boost:inherited="true"
      hx-swap:inherited="innerMorph"
      {% if player %}hx-multipart:connect="/stream"{% endif %}
      hx-on="keydown, keyup -> data.deleteMode = event.shiftKey">

{% if player %}
    <main id="app"
          data-player-id="{{ player.id }}"
          style="--player-color: {{ player.color }}">
        {% include "_world.html" %}

        <aside id="controls"
               aria-label="Game controls"
               hx-on="htmx:request:latency:configuration from:document ->
                      event.detail.delay = $('#simulate-latency-toggle').checked
                          ? Number($('#simulate-latency-toggle').value)
                          : 0">
            {% if player.name == "scriptogre" %}
                {% include "_admin_controls.html" %}
            {% endif %}
            <details id="settings">
                <summary class="ui-control" aria-label="Settings">
                    <span class="icon-[lucide--settings]" aria-hidden="true"></span>
                    <span class="settings-label">Settings</span>
                    <span class="settings-chevron icon-[lucide--chevron-down]" aria-hidden="true"></span>
                </summary>
                <div>
                    <label class="setting">
                        <span class="icon-[lucide--snail]" aria-hidden="true"></span>
                        <span>Simulate Latency <small>(+250ms)</small></span>
                        <input id="simulate-latency-toggle" type="checkbox" value="250">
                    </label>
                    <label class="setting">
                        <span class="icon-[lucide--zap]" aria-hidden="true"></span>
                        <span>Client Predictions</span>
                        <input id="predictions-toggle" type="checkbox" checked>
                    </label>
                </div>
            </details>
            <output id="request-latency"
                    hx-on="htmx:request:latency:measurement from:document ->
                           style.setProperty('--request-latency-ms', event.detail.ms)"
                    :value="`${style.getPropertyValue('--request-latency-ms') || '--'}ms`"
                    aria-label="Last request time">--ms</output>
        </aside>

        <button id="logout-button" class="ui-control" hx-post="/logout">
            <span class="icon-[lucide--log-out]" aria-hidden="true"></span>
            Log out
        </button>

        <button id="delete-mode-button" class="ui-control"
                type="button"
                aria-pressed="false"
                :aria-pressed="data.deleteMode"
                :aria-label="data.deleteMode ? 'Exit delete mode' : 'Enter delete mode'"
                hx-on:click="data.deleteMode = !data.deleteMode">
            <span class="icon-[lucide--trash-2]" :hidden="data.deleteMode" aria-hidden="true"></span>
            <span class="icon-[lucide--check]" :hidden="!data.deleteMode" aria-hidden="true"></span>
            <span>Delete</span>
        </button>
    </main>

{% else %}

    {% include "_player_form.html" %}

{% endif %}

</body>
</html>
