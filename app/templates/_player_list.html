{% set online = players | selectattr("is_online") | list %}
<summary class="flex list-none items-center gap-1.5 cursor-pointer text-xs font-normal text-foreground/60 hover:text-foreground transition-colors">
  <span>{{ online | length }} online</span>
  <span class="icon-[lucide--chevron-down] size-3 transition-transform group-open:rotate-180"></span>
</summary>
<div class="absolute top-full left-0 mt-3 w-48 max-h-60 overflow-y-auto rounded-xl border border-border bg-card/90 backdrop-blur-md p-2 shadow-iso-sm">
  {% for player in online %}
  <div class="flex items-center gap-2 rounded-lg px-2 py-1.5">
    <span class="player-color player-badge flex size-6 shrink-0 items-center justify-center rounded-full text-[8px] font-semibold ring-1 ring-background"
          style="--base-color: {{ player.color.to_css() }}">
      {{ player.initials }}
    </span>
    <span class="truncate text-xs text-foreground">{{ player.name }}</span>
  </div>
  {% endfor %}
</div>
