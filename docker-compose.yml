services:
  postgres:
    image: postgres:17
    # Cursor/brick writes are cheap and replaceable; trade ~200ms of
    # crash-window durability for ~2x lower commit latency.
    command: postgres -c synchronous_commit=off
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hyperspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hyperspace}
      POSTGRES_DB: ${POSTGRES_DB:-hyperspace}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hyperspace} -d ${POSTGRES_DB:-hyperspace}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
