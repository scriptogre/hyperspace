<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Hyperspace stream compression benchmark</title>
<desc id="desc">A median warm update compresses 193,295 bytes of HTML to 47 bytes. After 100 updates the cumulative ratio is 1,369.3 to one.</desc>
<style>
  text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
  .muted { fill: #94a3b8; }
  .axis { fill: #94a3b8; font-size: 16px; font-weight: 600; }
</style>
<rect width="1200" height="675" rx="28" fill="#0b1120"/>
<circle cx="1090" cy="70" r="150" fill="#312e81" opacity="0.35"/>
<circle cx="1160" cy="160" r="110" fill="#0e7490" opacity="0.25"/>

<text x="72" y="72" fill="#67e8f9" font-size="22" font-weight="800" letter-spacing="2">HYPERSPACE · ZSTD STREAM</text>
<text x="72" y="158" fill="#f8fafc" font-size="66" font-weight="900">193 KB OF HTML</text>
<text x="72" y="226" fill="#94a3b8" font-size="48" font-weight="700">compresses to</text>
<text x="438" y="226" fill="#67e8f9" font-size="70" font-weight="900">47 BYTES</text>
<text x="72" y="275" class="muted" font-size="22">median warm cursor update per stream · 4,113:1</text>

<text x="72" y="326" fill="#e2e8f0" font-size="18" font-weight="800" letter-spacing="1.5">CUMULATIVE COMPRESSION RATIO</text>
<line x1="92" y1="566.0" x2="1110" y2="566.0" stroke="#2b3342" stroke-width="1"/><text x="74" y="572.0" text-anchor="end" class="axis">0:1</text><line x1="92" y1="459.0" x2="1110" y2="459.0" stroke="#2b3342" stroke-width="1"/><text x="74" y="465.0" text-anchor="end" class="axis">750:1</text><line x1="92" y1="352.0" x2="1110" y2="352.0" stroke="#2b3342" stroke-width="1"/><text x="74" y="358.0" text-anchor="end" class="axis">1,500:1</text>
<polyline points="92.0,560.2 295.6,560.2 499.2,560.2 702.8,560.2 906.4,560.2 1110.0,560.2" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="9 9"/>
<polyline points="92.0,560.2 295.6,560.2 499.2,548.9 702.8,535.4 906.4,498.5 1110.0,370.7" fill="none" stroke="#67e8f9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="92.0" cy="560.2" r="6" fill="#67e8f9" stroke="#0f172a" stroke-width="3"/><circle cx="295.6" cy="560.2" r="6" fill="#67e8f9" stroke="#0f172a" stroke-width="3"/><circle cx="499.2" cy="548.9" r="6" fill="#67e8f9" stroke="#0f172a" stroke-width="3"/><circle cx="702.8" cy="535.4" r="6" fill="#67e8f9" stroke="#0f172a" stroke-width="3"/><circle cx="906.4" cy="498.5" r="6" fill="#67e8f9" stroke="#0f172a" stroke-width="3"/><circle cx="1110.0" cy="370.7" r="6" fill="#67e8f9" stroke="#0f172a" stroke-width="3"/>
<text x="92.0" y="600" text-anchor="middle" class="axis">0</text><text x="295.6" y="600" text-anchor="middle" class="axis">1</text><text x="499.2" y="600" text-anchor="middle" class="axis">5</text><text x="702.8" y="600" text-anchor="middle" class="axis">10</text><text x="906.4" y="600" text-anchor="middle" class="axis">25</text><text x="1110.0" y="600" text-anchor="middle" class="axis">100</text>
<text x="1110" y="326" text-anchor="end" class="muted" font-size="17">updates</text>
<text x="1100.0" y="374.0" text-anchor="end" fill="#67e8f9" font-size="23" font-weight="900">1,369:1</text>

<line x1="72" y1="630" x2="1128" y2="630" stroke="#273449"/>
<text x="72" y="658" class="muted" font-size="17">16×16 world · 100 cursors · 0 bricks · no joins · application body bytes</text>
<text x="1128" y="658" text-anchor="end" fill="#cbd5e1" font-size="17" font-weight="700">github.com/scriptogre/hyperspace</text>
</svg>