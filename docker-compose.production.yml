name: hyperspace

services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        ENVIRONMENT: production
    env_file: ${HYPERSPACE_ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: /var/run/postgresql
    expose:
      - "8000"
    volumes:
      - .:/code:ro
      - postgres_socket:/var/run/postgresql
    init: true
    entrypoint: ["sh", "/code/scripts/migrate-and-run"]
    command: granian --interface asgi --host 0.0.0.0 --reload --reload-paths app --workers-kill-timeout 1 app.main:app
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  postgres:
    image: postgres:17
    env_file: ${HYPERSPACE_ENV_FILE:-.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_socket:/var/run/postgresql
    command: postgres -c listen_addresses= -c synchronous_commit=off -c shared_buffers=512MB -c shared_preload_libraries=pg_stat_statements
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h /var/run/postgresql -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: always

volumes:
  postgres_data:
  postgres_socket:
