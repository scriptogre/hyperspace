services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: production
    expose: [8000]
    init: true
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-hyperspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hyperspace}
      POSTGRES_DB: ${POSTGRES_DB:-hyperspace}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${WEB_CONCURRENCY:-4} --ws-per-message-deflate false
    restart: always
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    command: postgres -c synchronous_commit=off -c shared_buffers=512MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hyperspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hyperspace}
      POSTGRES_DB: ${POSTGRES_DB:-hyperspace}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hyperspace} -d ${POSTGRES_DB:-hyperspace}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: always

volumes:
  postgres_data:

# Docker's default address pools are exhausted on the ThinkCentre,
# so the default network is pinned to a free subnet outside the defaults.
networks:
  default:
    ipam:
      config:
        - subnet: 10.98.0.0/24
