services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: production
    expose: [8000]
    volumes:
      - postgres_socket:/var/run/postgresql
    init: true
    tty: true
    env_file: .env
    environment:
      POSTGRES_HOST: /var/run/postgresql
    entrypoint: ["sh", "/code/scripts/migrate-and-run"]
    command: granian --interface asgi --host 0.0.0.0 app.main:app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_socket:/var/run/postgresql
    command: postgres -c listen_addresses= -c synchronous_commit=off -c shared_buffers=512MB -c shared_preload_libraries=pg_stat_statements
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h /var/run/postgresql -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: always

volumes:
  postgres_data:
  postgres_socket:
