services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: production
    expose: [8000]
    init: true
    tty: true
    env_file: .env
    command: granian --interface asgi --http 1 --loop uvloop --task-impl asyncio --host 0.0.0.0 --port 8000 --workers ${WEB_CONCURRENCY:-4} app.main:app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: postgres -c synchronous_commit=off -c shared_buffers=512MB -c shared_preload_libraries=pg_stat_statements
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: always

volumes:
  postgres_data:
