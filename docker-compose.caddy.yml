services:
  caddy:
    image: caddy:2
    env_file: ${HYPERSPACE_ENV_FILE:-.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      fastapi:
        condition: service_healthy
    restart: always

volumes:
  caddy_data:
  caddy_config:
