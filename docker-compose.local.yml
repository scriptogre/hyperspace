services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: local
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    init: true
    tty: true
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app --ws-per-message-deflate false
    restart: unless-stopped
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: postgres -c synchronous_commit=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  tailwindcss:
    image: oven/bun:1-alpine
    tty: true
    init: true
    working_dir: /code
    volumes:
      - .:/code
    command: sh -c "bun install --frozen-lockfile && bunx tailwindcss -i ./app/static/css/input.css -o ./app/static/css/output.css --watch"

volumes:
  postgres_data:
