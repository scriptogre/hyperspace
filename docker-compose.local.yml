services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        ENVIRONMENT: local
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    init: true
    tty: true
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app --reload-include "*.html" --ws-per-message-deflate false --timeout-graceful-shutdown 1
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: postgres -c synchronous_commit=off -c shared_preload_libraries=pg_stat_statements
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  tailwindcss:
    image: oven/bun:1-alpine
    tty: true
    init: true
    working_dir: /code
    volumes:
      - .:/code
    command: sh -c "bun install --frozen-lockfile && bunx tailwindcss -i ./app/static/css/input.css -o ./app/static/css/output.css --watch"

  benchmark:
    build:
      context: .
      dockerfile: Dockerfile
      target: benchmark
    entrypoint: []
    command:
      - py-spy
      - record
      - --nonblocking
      - --rate
      - "100"
      - --full-filenames
      - --format
      - speedscope
      - --output
      - /code/bench/results/cpu.speedscope.json
      - --
      - python
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --workers
      - "1"
      - --log-level
      - warning
    ports:
      - "8001:8001"
    volumes:
      - .:/code
    init: true
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    env_file: .env
    environment:
      DEBUG: "false"
      ENVIRONMENT: testing
      POSTGRES_DB: hyperspace_bench
      POSTGRES_HOST: postgres
    stop_grace_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - benchmark

  tests:
    build:
      context: .
      dockerfile: Dockerfile
      target: tests
    volumes:
      - .:/code
    init: true
    ipc: host
    env_file: .env
    depends_on:
      fastapi:
        condition: service_healthy
    profiles:
      - test

volumes:
  postgres_data:
