[project]
name = "hyperspace"
readme = "README.md"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "tortoise-orm>=1.1.7",
    "asyncpg>=0.31.0",
    "minijinja>=2.21.0",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "itsdangerous>=2.2.0",
    "multipart-response[fastapi]>=0.1.0",
]

[tool.uv]
package = false

[tool.tortoise]
tortoise_orm = "app.config.TORTOISE_ORM"

[tool.pytest.ini_options]
testpaths = ["tests"]
# base-url is the Docker service name: e2e tests run containerized via `just test`.
addopts = "--base-url http://fastapi:8000"

[tool.prehook]
hooks = [
    "uvx ruff check",
    "uvx ruff format",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "py-spy>=0.4.2",
    "pytest>=9.1.1",
    "pytest-playwright>=0.8.0",
]
